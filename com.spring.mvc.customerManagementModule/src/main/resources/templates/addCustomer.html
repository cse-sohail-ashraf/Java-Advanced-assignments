<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<h2> Enter Customer Details </h2>
<form th:action=@{/saveCustomer} th:object=${customer} method="post">

	<input type="hidden" th:field="*{id}" />

	<label>Name: </label>
	<input type="text" th:field="*{name}" /> <br> <br>

	<label>Email: </label>
	<input type="text" th:field="*{email}" /> <br> <br>
	
	<label>Contact Number: </label>
	<input type="text" th:field="*{contactNumber}" /> <br> <br>

	<label>Address: </label>
	<input type="text" th:field="*{address}" /> <br> <br>

	<button type="submit">Save Customer</button>
	
</form>
</body>
</html>
