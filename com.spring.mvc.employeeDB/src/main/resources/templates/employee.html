<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<table border=1>
	<tr>
		<th>Id</th>
		<th>Name</th>
		<th>Email</th>
	</tr>
	<tr th:each="emp:${employees}">
		<td th:text = "${emp.id}"></td>
		<td th:text = "${emp.name}"></td>
		<td th:text = "${emp.email}"></td>
	</tr>
</table>
</body>
</html>
