<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<h2> Add Employee </h2>
<form th:action="@{/saveEmployee}" th:object="${employee}" method="post">
	<label>Name: </label>
	<input type="text" th:field="*{name}" /><br><br>

	<label>Email: </label>
	<input type="text" th:field="*{email}" /><br><br>

	<button type="submit">Save Employee</button>
</form>
</body>
</html>
